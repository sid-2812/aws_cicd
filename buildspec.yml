version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24

  pre_build:
    commands:
      - echo Installing dependencies...
      - cd frontend-angular
      - npm install

  build:
    commands:
      - echo Building Angular application...
      - npm run build
      - pwd
      - ls -la
      - ls -la dist/angular-starter
      - ls -la dist/angular-starter/browser

artifacts:
  base-directory: frontend-angular/dist/angular-starter/browser
  files:
    - '**/*'